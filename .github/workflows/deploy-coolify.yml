name: Deploy to Coolify

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: appscreen-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl --fail-with-body \
            --retry 3 \
            --retry-all-errors \
            --request GET \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "https://app.coolify.io/api/v1/deploy?uuid=ucmt7mt6s8d003igeua0pqlo&force=false"
