name: Validate and Publish SaaS Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.saas'
      - 'Dockerfile.saas.dockerignore'
      - 'docker-compose.saas.yml'
      - 'deploy/**'
      - 'server/**'
      - 'saas/**'
      - 'core/**'
      - 'render/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/saas-ci.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: saas-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  SAAS_IMAGE: ghcr.io/${{ github.repository_owner }}/appscreen-saas

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Validate SaaS Compose structure
        env:
          APP_BASE_URL: https://candidate.invalid
          DATABASE_URL: postgres://candidate:candidate@db.invalid:5432/appscreen
          APPSCREEN_SIGNING_SECRET: ci-only-signing-secret-ci-only-signing-secret-123456789
          SUPABASE_URL: https://supabase.invalid
          SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-private-placeholder
        run: docker compose --env-file /dev/null -f docker-compose.saas.yml config --quiet

  build-saas-image:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SAAS_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build SaaS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.saas
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=appscreen-saas
          cache-to: type=gha,mode=max,scope=appscreen-saas

  static-default-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explain deployment split
        run: |
          test -f Dockerfile
          test -f Dockerfile.saas
          test -f docker-compose.saas.yml
          echo 'Legacy Dockerfile remains the standalone editor.'
          echo 'SaaS production must use docker-compose.saas.yml / Dockerfile.saas.'
